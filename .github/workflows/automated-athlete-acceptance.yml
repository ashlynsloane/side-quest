name: Automated athlete acceptance
on:
  push:
    branches:
      - test/automated-athlete-acceptance-v1
  pull_request:
    paths:
      - 'packages/planner/**'
      - 'apps/mobile/**'
      - '.github/workflows/automated-athlete-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

# A branch push and its PR can both fire on the same commit. Keep the latest
# complete QA evidence rather than burning CI time on stale duplicate runs.
concurrency:
  group: athlete-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  athlete-acceptance:
    name: Planner and synthetic athlete QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck planner
        id: planner_typecheck
        run: pnpm --dir packages/planner typecheck
      - name: Typecheck mobile
        id: mobile_typecheck
        run: pnpm --dir apps/mobile typecheck
      - name: Synthetic athlete acceptance
        id: synthetic_suite
        run: pnpm --dir packages/planner exec vitest run test/automated-athlete-acceptance.test.ts --reporter=default --reporter=junit --outputFile.junit=../../athlete-acceptance-junit.xml
      - name: Real mobile workout SQLite acceptance (including injected failures)
        id: mobile_sql_suite
        run: pnpm --dir packages/planner exec vitest run test/actual-mobile-workout-sqlite.test.ts --reporter=default --reporter=junit --outputFile.junit=../../mobile-workout-qa-junit.xml
      - name: Full planner regression suite including SQLite
        id: full_planner
        run: pnpm --dir packages/planner exec vitest run --reporter=default --reporter=junit --outputFile.junit=../../planner-regression-junit.xml
      - name: Validate iOS JavaScript export (not native launch)
        id: ios_js_export
        run: pnpm --dir apps/mobile exec expo export --platform ios --output-dir /tmp/sq-acceptance-ios
      - name: Summarize synthetic and mobile SQLite evidence
        if: always()
        env:
          QA_PLANNER_TYPECHECK: ${{ steps.planner_typecheck.outcome }}
          QA_MOBILE_TYPECHECK: ${{ steps.mobile_typecheck.outcome }}
          QA_SYNTHETIC_SUITE: ${{ steps.synthetic_suite.outcome }}
          QA_MOBILE_SQL_SUITE: ${{ steps.mobile_sql_suite.outcome }}
          QA_FULL_PLANNER: ${{ steps.full_planner.outcome }}
          QA_IOS_JS_EXPORT: ${{ steps.ios_js_export.outcome }}
        run: node scripts/qa/summarize-junit.mjs athlete-acceptance-junit.xml mobile-workout-qa-junit.xml planner-regression-junit.xml
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-athlete-qa-results
          path: |
            athlete-acceptance-junit.xml
            mobile-workout-qa-junit.xml
            planner-regression-junit.xml
            qa-summary.json
          if-no-files-found: warn
