name: Rehab memory validation
on:
  push:
    branches:
      - feat/generalized-injury-engine-v1
  pull_request:
    paths:
      - 'packages/planner/src/injury*'
      - 'packages/planner/src/rehab-*'
      - 'packages/planner/test/injury*'
      - 'packages/planner/test/rehab-*'
      - 'apps/mobile/src/services/database.ts'
      - 'apps/mobile/src/services/injury-memory-store.ts'
      - '.github/workflows/rehab-validation.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/planner test
      - run: pnpm typecheck
