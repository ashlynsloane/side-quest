name: Experimental training guardrail validation

on:
  # Historic experimental-guardrail branch only. The canonical PR #12
  # already runs the complete planner suite in automated-athlete-acceptance.
  # Avoid a second redundant planner job on every review commit.
  push:
    branches:
      - feat/experimental-training-ramp-guardrails
  workflow_dispatch:

jobs:
  test-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck planner
        run: pnpm --dir packages/planner typecheck
      - name: Planner regression tests
        run: pnpm --dir packages/planner test
