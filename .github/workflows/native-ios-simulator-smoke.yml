name: Native iOS simulator smoke (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-ios-smoke:
    name: Build and launch isolated synthetic iOS app
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
      QA_BUNDLE_ID: com.sidequest.synthetic.qa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Isolate app identity in ephemeral runner only
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'apps/mobile/app.json';
          const app = JSON.parse(readFileSync(path, 'utf8'));
          app.expo.name = 'Side Quest Synthetic QA';
          app.expo.ios.bundleIdentifier = process.env.QA_BUNDLE_ID;
          app.expo.scheme = 'sidequest-synthetic-qa';
          writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          NODE
          echo "Synthetic bundle ID: $QA_BUNDLE_ID"
      - name: Select available iOS simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            let input = "";
            process.stdin.on("data", c => input += c).on("end", () => {
              const devices = Object.entries(JSON.parse(input).devices)
                .filter(([runtime]) => /iOS/i.test(runtime))
                .flatMap(([, values]) => values)
                .filter(device => device.isAvailable && /iPhone/i.test(device.name));
              if (!devices.length) process.exit(2);
              process.stdout.write(devices[0].udid);
            });')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $UDID"
      - name: Generate ephemeral native project
        run: pnpm --dir apps/mobile exec expo prebuild --platform ios --clean --no-install --non-interactive
      - name: Resolve CocoaPods
        run: |
          cd apps/mobile/ios
          pod install
      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
      - name: Build native iOS simulator Release app
        run: |
          set -o pipefail
          WORKSPACE=$(find apps/mobile/ios -maxdepth 2 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/sidequest-synthetic-build" \
            CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/sidequest-xcodebuild.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/sidequest-xcodebuild.log"
              exit 1
            }
      - name: Install, launch and capture native screen
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/sidequest-synthetic-build/Build/Products/Release-iphonesimulator" \
            -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.simulator.outputs.udid }}" "$QA_BUNDLE_ID" | tee synthetic-ios-launch.txt
          sleep 8
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot synthetic-ios-first-launch.png
          test -s synthetic-ios-first-launch.png
      - name: Save screenshot and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-synthetic-ios-smoke
          path: |
            synthetic-ios-first-launch.png
            synthetic-ios-launch.txt
            ${{ runner.temp }}/sidequest-xcodebuild.log
          if-no-files-found: warn
