name: Native iOS simulator acceptance
on:
  # Native tests rerun only for the workflow or scenario definitions.
  push:
    branches: [test/automated-athlete-acceptance-v1]
    paths:
      - '.github/workflows/native-ios-simulator-smoke.yml'
      - 'e2e/maestro/**'
  workflow_dispatch:

permissions:
  contents: read

# Do not spend macOS/Xcode build time on superseded QA revisions.
concurrency:
  group: native-ios-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-ios-smoke:
    name: Build, launch, and exercise isolated synthetic iOS app
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'
      CI: '1'
      QA_BUNDLE_ID: com.sidequest.synthetic.qa
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Isolate app identity in ephemeral runner only
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'apps/mobile/app.json';
          const app = JSON.parse(readFileSync(path, 'utf8'));
          app.expo.name = 'Side Quest Synthetic QA';
          app.expo.ios.bundleIdentifier = process.env.QA_BUNDLE_ID;
          app.expo.scheme = 'sidequest-synthetic-qa';
          writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          NODE
          echo "Synthetic bundle ID: $QA_BUNDLE_ID"
      - name: Select available iOS simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            let input = "";
            process.stdin.on("data", c => input += c).on("end", () => {
              const devices = Object.entries(JSON.parse(input).devices)
                .filter(([runtime]) => /iOS/i.test(runtime))
                .flatMap(([, values]) => values)
                .filter(device => device.isAvailable && /iPhone/i.test(device.name));
              if (!devices.length) process.exit(2);
              process.stdout.write(devices[0].udid);
            });')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $UDID"
      - name: Generate ephemeral native project
        run: pnpm --dir apps/mobile exec expo prebuild --platform ios --clean --no-install
      - name: Resolve CocoaPods
        run: |
          cd apps/mobile/ios
          pod install
      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
      - name: Build native iOS simulator Release app
        run: |
          set -o pipefail
          WORKSPACE=$(find apps/mobile/ios -maxdepth 2 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/sidequest-synthetic-build" \
            CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/sidequest-xcodebuild.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/sidequest-xcodebuild.log"
              exit 1
            }
      - name: Install, launch and capture native screen
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/sidequest-synthetic-build/Build/Products/Release-iphonesimulator" \
            -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          xcrun simctl install "${{ steps.simulator.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.simulator.outputs.udid }}" "$QA_BUNDLE_ID" | tee synthetic-ios-launch.txt
          sleep 8
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot synthetic-ios-first-launch.png
          test -s synthetic-ios-first-launch.png
      - name: Install Java for native UI automation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version
      - name: Run staged synthetic native UI journeys
        id: maestro_ui
        timeout-minutes: 30
        run: |
          set +e
          mkdir -p maestro-evidence
          export PATH="$HOME/.maestro/bin:$PATH"
          UDID="${{ steps.simulator.outputs.udid }}"
          # Each scenario starts with a new fictional local profile. Never
          # execute downstream assertions when an upstream prerequisite fails.
          run_flow() {
            LABEL="$1"
            FILE="$2"
            maestro --udid="$UDID" test \
              --format junit --output "maestro-evidence/${LABEL}-junit.xml" \
              --test-output-dir="maestro-evidence/${LABEL}" \
              "$FILE" > "maestro-evidence/${LABEL}-console.log" 2>&1
            RESULT=$?
            tail -n 70 "maestro-evidence/${LABEL}-console.log"
            return "$RESULT"
          }
          PROFILE_STATUS=99
          ONBOARDING_STATUS=99
          RIDE_STATUS=99
          RESTART_STATUS=99
          run_flow profile e2e/maestro/synthetic-profile-entry.yaml
          PROFILE_STATUS=$?
          if [ "$PROFILE_STATUS" -eq 0 ]; then
            run_flow onboarding e2e/maestro/synthetic-onboarding-first-week.yaml
            ONBOARDING_STATUS=$?
          else
            echo "Onboarding blocked by failed profile entry." | tee maestro-evidence/onboarding-console.log
          fi
          if [ "$ONBOARDING_STATUS" -eq 0 ]; then
            run_flow ride e2e/maestro/synthetic-completed-ride.yaml
            RIDE_STATUS=$?
          else
            echo "Completed ride blocked by failed onboarding." | tee maestro-evidence/ride-console.log
          fi
          if [ "$RIDE_STATUS" -eq 0 ]; then
            run_flow restart e2e/maestro/synthetic-ride-restart.yaml
            RESTART_STATUS=$?
          else
            echo "Cold restart blocked by failed completed-ride journey." | tee maestro-evidence/restart-console.log
          fi
          xcrun simctl io "$UDID" screenshot maestro-evidence/final-simulator-screen.png || true
          echo "profile=$PROFILE_STATUS" >> "$GITHUB_OUTPUT"
          echo "onboarding=$ONBOARDING_STATUS" >> "$GITHUB_OUTPUT"
          echo "ride=$RIDE_STATUS" >> "$GITHUB_OUTPUT"
          echo "restart=$RESTART_STATUS" >> "$GITHUB_OUTPUT"
          {
            echo "## Native iOS acceptance"
            for RESULT in profile:$PROFILE_STATUS onboarding:$ONBOARDING_STATUS ride:$RIDE_STATUS restart:$RESTART_STATUS; do
              echo "- $RESULT"
            done
            echo "0=passed; 99=blocked/not executed; other nonzero=failed."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PROFILE_STATUS" -ne 0 ] || [ "$ONBOARDING_STATUS" -ne 0 ] || [ "$RIDE_STATUS" -ne 0 ] || [ "$RESTART_STATUS" -ne 0 ]; then
            echo "Native journey failed or was blocked; inspect artifacts."
            exit 1
          fi
      - name: Save screenshot and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-synthetic-ios-smoke
          path: |
            synthetic-ios-first-launch.png
            synthetic-ios-launch.txt
            maestro-evidence/
            ${{ runner.temp }}/sidequest-xcodebuild.log
          if-no-files-found: warn
