# Native SIGKILL phase 1: initial partial workout was durably journaled
# in athlete-scoped LiveSession, but the QA-only app awaits before SQL.
# The host script then verifies DB 0/0 and kills the exact app PID with -9.
appId: com.sidequest.synthetic.qa
---
- runFlow: synthetic-strength-pause-checkpoint.yaml
- assertVisible: "WORKOUT IN PROGRESS"
- tapOn:
    id: "sidequest-qa-resume-active-workout"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Recover and record"
    timeout: 30000
- tapOn: "End"
- tapOn: "Save partial"
- extendedWaitUntil:
    visible:
      id: "sidequest-qa-completion-journal-durable-before-sql"
    timeout: 45000
- assertVisible: "PARTIAL WORKOUT"
- takeScreenshot: "native-synthetic-partial-journal-before-sigkill"
