# Minimal native sign-in contract, independent of week generation.
appId: com.sidequest.synthetic.qa
---
- launchApp:
    clearState: true
# In native run 43137076308 the visible heading existed in the hierarchy,
# but exact-text assertion returned false. The email field's native testID is
# a stronger stable readiness signal and has passed across six-stage runs.
- extendedWaitUntil:
    visible:
      id: "sidequest-qa-athlete-email"
    timeout: 45000
# The lower email input is covered by the keyboard if Name was entered first.
# Enter Email while both inputs are unobscured, then switch UP to Name.
# Native iOS XCTest occasionally focuses the first form field while the
# initial email tap is still settling (archived strength run 43152426701).
# Fill NAME first, deliberately dismiss the keyboard, then enter EMAIL.
# Assert real focused and enabled state so no malformed QA identity can pass.
- waitForAnimationToEnd
- tapOn:
    id: "sidequest-qa-athlete-name"
- assertVisible:
    id: "sidequest-qa-athlete-name"
    focused: true
- inputText: "Synthetic QA Athlete"
- tapOn: "Create your beta profile"
- waitForAnimationToEnd
- tapOn:
    id: "sidequest-qa-athlete-email"
- assertVisible:
    id: "sidequest-qa-athlete-email"
    focused: true
- inputText: "synthetic-athlete@example.invalid"
- tapOn: "Create your beta profile"
- extendedWaitUntil:
    visible:
      id: "sidequest-qa-enter-beta"
      enabled: true
    timeout: 30000
- tapOn:
    id: "sidequest-qa-enter-beta"
- extendedWaitUntil:
    visible: "Build your first week."
    timeout: 30000
- takeScreenshot: "synthetic-account-onboarding-entry"
